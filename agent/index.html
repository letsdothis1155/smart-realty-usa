<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find an agent — SmartRealty</title>
  <meta name="description" content="Request an optional introduction to a licensed real-estate professional. Consent required. SmartRealty does not automatically sell your information." />
  <link rel="canonical" href="https://smartrealty.us/agent/" />
  <meta property="og:title" content="Find an agent" />
  <meta property="og:url" content="https://smartrealty.us/agent/" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a0c10" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" /><link rel="stylesheet" href="/growth.css" />
  <script src="/domain-config.js"></script><script src="/js/auth-client.js"></script><script src="/js/analytics.js"></script><script src="/js/growth.js"></script><script src="/js/revenue.js"></script>
</head>
<body class="g-page" data-growth="learn">
  <div id="gChrome"></div>
  <main class="g-section">
    <div class="container">
      <p class="g-kicker">Agent intro · consent only</p>
      <h1>Ask for help from a licensed agent</h1>
      <p class="g-lead">Check the box and Andrew will look for an appropriate licensed person to connect you with. We won't attach bank or payroll data, and paid matching stays off until legal review.</p>
      <form class="g-form g-card" data-lead-form data-intent="agent" data-source="agent_page">
        <label>Name <input name="name" autocomplete="name" /></label>
        <label>Email <input name="email" type="email" required autocomplete="email" /></label>
        <label>Phone <input name="phone" type="tel" /></label>
        <label>City <input name="city" /></label>
        <label>State <input name="state" maxlength="2" placeholder="KY" /></label>
        <label>I am
          <select name="budget">
            <option value="buy">Buying</option>
            <option value="sell">Selling</option>
            <option value="rent">Renting</option>
            <option value="invest">Investing</option>
          </select>
        </label>
        <label>Property or notes <textarea name="message" rows="3"></textarea></label>
        <label class="auth-check"><input type="checkbox" name="consent" required /> <span>You may contact me and, if I later say yes in writing, introduce a licensed professional. Do not sell this lead from this click.</span></label>
        <button type="submit" class="btn btn-primary">Request an introduction</button>
        <p class="g-msg hidden" data-lead-msg></p>
      </form>
      <p><a href="/agents/">Agent plans (catalog, not live billed)</a></p>
    </div>
  </main>
  <div id="gFoot"></div>
  <script src="/js/growth-ui.js"></script>
  <script src="/js/revenue-ui.js"></script>
</body>
</html>
