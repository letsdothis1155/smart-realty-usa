name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install Node dependencies
        working-directory: server
        run: npm ci
      - name: Run Node tests
        working-directory: server
        run: npm test
      - name: Lint PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Block known published credentials
        run: |
          known_demo="Smart""Realty2026"
          known_admin="Smart""RealtyAdmin2026"
          known_node="sru-dev-secret-""change-me-in-production"
          if git grep -nE "${known_demo}|${known_admin}|${known_node}"; then
            echo 'Known credential or insecure default detected.' >&2
            exit 1
          fi
